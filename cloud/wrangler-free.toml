name = "sparkshark"
main = "free/index.ts"
compatibility_date = "2026-11-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "sparkshark.sharmoon.cc.cd"
custom_domain = true

[assets]
directory = "../output/cloud-assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/fonts/*.ttf"]

[vars]
APP_ORIGIN = "https://sparkshark.sharmoon.cc.cd"

[dev]
port = 8788
local_protocol = "http"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[durable_objects.bindings]]
name = "STATE"
class_name = "MyResumeState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MyResumeState"]

[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
